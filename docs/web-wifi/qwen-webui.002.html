<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED Lamp Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            color: #1C1C1E;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        body.dark-theme {
            background: #1C1C1E;
            color: #FFFFFF;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar - верхняя панель со статусами */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: #F2F2F7;
            border-radius: 12px;
        }

        body.dark-theme .status-bar {
            background: #2C2C2E;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon-small {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .device-icon-small svg {
            width: 100%;
            height: 100%;
        }

        .status-icons {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            opacity: 0.3;
            transition: opacity 0.3s, fill 0.3s;
        }

        .status-icon.active {
            opacity: 1;
        }

        .status-icon.wifi.active {
            fill: #34C759;
        }

        .status-icon.wifi.error {
            fill: #8E8E93;
        }

        .status-icon.mqtt.active {
            fill: #660066;
        }

        .status-icon.mqtt.error {
            fill: #8E8E93;
        }

        .status-icon.telegram.active {
            fill: #0088CC;
        }

        .status-icon.telegram.error {
            fill: #8E8E93;
        }

        /* Header - прижат к верху */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            text-align: center;
        }

        .device-info-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .device-info-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .device-name {
            font-size: 20px;
            font-weight: 700;
            color: #1C1C1E;
            margin-bottom: 4px;
        }

        body.dark-theme .device-name {
            color: #FFFFFF;
        }

        .device-description {
            font-size: 15px;
            font-weight: 400;
            color: #8E8E93;
            line-height: 1.4;
        }

        body.dark-theme .device-description {
            color: #98989D;
        }

        .settings-button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: #FFFFFF;
            color: #8E8E93;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        body.dark-theme .settings-button {
            background: #3A3A3C;
            color: #98989D;
        }

        .settings-button:hover {
            background: #007AFF;
            color: #FFFFFF;
        }

        body.dark-theme .settings-button:hover {
            background: #0A84FF;
            color: #FFFFFF;
        }

        .settings-button:active {
            transform: scale(0.95);
        }

        .settings-button svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: fill 0.2s;
        }

        /* Power Button Section - занимает центральное место */
        .power-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-top: -20px;
        }

        .power-button-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .power-button {
            position: relative;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Внешнее кольцо */
        .power-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #E5E5EA;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        body.dark-theme .power-ring {
            border-color: #38383A;
        }

        .power-button.on .power-ring {
            border-color: #007AFF;
            box-shadow: 0 0 30px rgba(0, 122, 255, 0.4);
        }

        /* Внутренний круг с символом питания */
        .power-symbol {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, box-shadow 0.3s;
        }

        body.dark-theme .power-symbol {
            background: #2C2C2E;
        }

        .power-button.on .power-symbol {
            background: #007AFF;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.5);
        }

        .power-symbol svg {
            width: 48px;
            height: 48px;
            fill: #8E8E93;
            transition: fill 0.3s;
        }

        body.dark-theme .power-symbol svg {
            fill: #98989D;
        }

        .power-button.on .power-symbol svg {
            fill: #FFFFFF;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        /* Brightness Section - прижат к низу */
        .brightness-section {
            background: #F2F2F7;
            border-radius: 12px;
            padding: 16px;
            margin-top: auto;
        }

        body.dark-theme .brightness-section {
            background: #2C2C2E;
        }

        .brightness-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .brightness-label {
            font-size: 15px;
            font-weight: 600;
            color: #1C1C1E;
        }

        body.dark-theme .brightness-label {
            color: #FFFFFF;
        }

        .brightness-value {
            font-size: 15px;
            font-weight: 600;
            color: #007AFF;
        }

        body.dark-theme .brightness-value {
            color: #0A84FF;
        }

        .brightness-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brightness-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: #FFFFFF;
            color: #007AFF;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.dark-theme .brightness-btn {
            background: #3A3A3C;
            color: #0A84FF;
        }

        .brightness-btn:hover {
            background: #007AFF;
            color: #FFFFFF;
        }

        body.dark-theme .brightness-btn:hover {
            background: #0A84FF;
            color: #FFFFFF;
        }

        .brightness-btn:active {
            transform: scale(0.95);
        }

        /* Кастомный трек для слайдера с заполнением */
        .brightness-slider-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            height: 44px;
        }

        /* Сплошная синяя полоса под слайдером */
        .brightness-fill {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 12px;
            background: #007AFF;
            border-radius: 6px;
            pointer-events: none;
            z-index: 1;
        }

        body.dark-theme .brightness-fill {
            background: #0A84FF;
        }

        .brightness-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 44px;
            background: transparent;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .brightness-slider:focus {
            outline: none;
        }

        /* Кастомный трек для слайдера (прозрачный, видна только полоса заполнения) */
        .brightness-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: transparent;
        }

        body.dark-theme .brightness-slider::-webkit-slider-runnable-track {
            background: transparent;
        }

        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            margin-top: -8px;
            transition: transform 0.1s;
        }

        body.dark-theme .brightness-slider::-webkit-slider-thumb {
            background: #3A3A3C;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .brightness-slider:active::-webkit-slider-thumb {
            transform: scale(1.1);
        }

        /* Скрыть стандартные элементы управления Firefox */
        .brightness-slider::-moz-range-track {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: transparent;
            border: none;
        }

        body.dark-theme .brightness-slider::-moz-range-track {
            background: transparent;
        }

        .brightness-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: none;
        }

        body.dark-theme .brightness-slider::-moz-range-thumb {
            background: #3A3A3C;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Адаптив для мобильных */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .power-button-wrapper {
                width: 140px;
                height: 140px;
            }

            .power-symbol {
                width: 84px;
                height: 84px;
            }

            .power-symbol svg {
                width: 42px;
                height: 42px;
            }

            .device-name {
                font-size: 18px;
            }

            .device-description {
                font-size: 14px;
            }
        }

        /* Large font mode */
        body.large-font .device-name {
            font-size: 24px;
        }

        body.large-font .device-description {
            font-size: 18px;
        }

        body.large-font .brightness-label {
            font-size: 18px;
        }

        body.large-font .brightness-value {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Status Bar с иконками статусов -->
        <div class="status-bar">
            <div class="status-left">
                <!-- Иконка устройства -->
                <div class="device-icon-small" id="deviceIconSmall">
                    <!-- SVG иконка будет вставлена через JS -->
                </div>
                <!-- Статусные иконки -->
                <div class="status-icons">
                    <!-- WiFi статус -->
                    <svg class="status-icon wifi" id="statusWifi" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3C7.79 3 3.7 4.41 0.43 6.75L12 21L23.57 6.75C20.3 4.41 16.21 3 12 3M12 9C9.3 9 6.68 9.89 4.56 11.43L12 20.59L19.44 11.43C17.32 9.89 14.7 9 12 9M12 13C10.35 13 8.75 13.51 7.4 14.5L12 20.14L16.6 14.5C15.25 13.51 13.65 13 12 13Z"/>
                    </svg>
                    <!-- MQTT статус -->
                    <svg class="status-icon mqtt" id="statusMqtt" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.1 133.9v46.7c73.8 0.1 134 59.3 135 132.4h45.5C186.5 214.6 106.1 134.8 7.1 133.9z M7.1 37.3v46.7c127.4 0.1 231.1 102.5 232.1 228.9h45.5C283.7 161.4 159.7 38.3 7.1 37.3z M312.9 193.5V97.6c-11.8-16.1-25.9-33.4-40.4-47.8c-16-15.9-34.1-30.1-52.3-42.7H119C207.3 38.9 278.1 107.2 312.9 193.5z"/>
                    </svg>
                    <!-- Telegram статус -->
                    <svg class="status-icon telegram" id="statusTelegram" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="14" fill="url(#paint0_linear)"/>
                        <path d="M22.99 10.21C23.11 9.4 22.35 8.77 21.63 9.08L7.36 15.34C6.85 15.57 6.89 16.35 7.42 16.52L10.36 17.45C10.92 17.63 11.53 17.54 12.02 17.2L18.66 12.62C18.86 12.48 19.07 12.77 18.9 12.94L14.13 17.86C13.67 18.34 13.76 19.15 14.31 19.5L19.66 22.85C20.26 23.23 21.03 22.85 21.14 22.13L22.99 10.21Z"/>
                        <defs>
                            <linearGradient id="paint0_linear" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#37BBFE"/>
                                <stop offset="1" stop-color="#007DBB"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <button class="settings-button" id="settingsBtn" title="Settings">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84a.484.484 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.09 8.83a.488.488 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.488.488 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.27.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.488.488 0 0 0-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>

        <!-- Header с информацией об устройстве -->
        <div class="header">
            <div class="device-info-container">
                <div class="device-info-content">
                    <div class="device-name" id="deviceName">LED Lamp</div>
                    <div class="device-description" id="deviceDescription">Under-cabinet light</div>
                </div>
            </div>
        </div>

        <!-- Кнопка включения/выключения -->
        <div class="power-section">
            <div class="power-button-wrapper">
                <button class="power-button" id="powerBtn">
                    <div class="power-ring"></div>
                    <div class="power-symbol">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
                        </svg>
                    </div>
                </button>
            </div>
        </div>

        <!-- Секция управления яркостью -->
        <div class="brightness-section">
            <div class="brightness-header">
                <span class="brightness-label" data-i18n="brightness">Brightness</span>
                <span class="brightness-value" id="brightnessValue">100%</span>
            </div>
            <div class="brightness-controls">
                <button class="brightness-btn" id="brightnessDown">−</button>
                <div class="brightness-slider-container">
                    <input type="range" class="brightness-slider" id="brightnessSlider" min="0" max="100" value="100">
                    <div class="brightness-fill" id="brightnessFill"></div>
                </div>
                <button class="brightness-btn" id="brightnessUp">+</button>
            </div>
        </div>
    </div>

    <script>
        // SVG иконка устройства
        const DEVICE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="64mm" height="64mm" viewBox="0 0 64 64"><style>.lamp-glow{animation:glow 5s ease-in-out infinite}@keyframes glow{0%,100%{fill-opacity:1;stroke-opacity:1}50%{fill-opacity:0.7;stroke-opacity:0.7}}</style><rect x="14.45" y="2.39" width="36.71" height="6.44" ry="0.18" fill="#a2d6fe" stroke="#20446e" stroke-width="1.465"/><path class="lamp-glow" fill="#ffffff" stroke="#20446e" stroke-width="1.465" d="M 26.49 9.5 A 6.35 6.16 0 0 0 32.84 15.66 A 6.35 6.16 0 0 0 39.19 9.5"/><path fill="none" stroke="#a2d6fe" stroke-width="0.9" stroke-linecap="round" d="M 17.82 34.35 A 24.41 23.89 0 0 1 8.25 15.38"/><path fill="none" stroke="#a2d6fe" stroke-width="0.9" stroke-linecap="round" d="M 57.22 15.13 A 24.41 23.89 0 0 1 50.98 31.09"/><path fill="none" stroke="#a2d6fe" stroke-width="0.965" stroke-linecap="round" d="M 19.98 27.3 A 16.93 16.47 0 0 1 15.6 16.25"/><path fill="none" stroke="#a2d6fe" stroke-width="0.979" stroke-linecap="round" d="M 50.33 15.89 A 25.41 16.29 0 0 1 47.26 23.65"/><path fill="none" stroke="#a2d6fe" stroke-width="0.98" stroke-linecap="round" d="M 25.52 22.96 A 10.11 9.1 0 0 1 22.59 16.55"/><path fill="none" stroke="#a2d6fe" stroke-width="0.98" stroke-linecap="round" d="M 42.87 16.29 A 10.11 9.1 0 0 1 37.59 24.28"/><path fill="none" stroke="#1e436d" stroke-width="1.565" stroke-linecap="round" stroke-linejoin="round" d="M 43.52 58.03 L 40.14 54.58 L 36.43 54.32 L 21.47 40.08 L 21.47 37.67 L 22.97 36.43 L 24.66 36.82"/><path fill="none" stroke="#1e436d" stroke-width="1.565" stroke-linecap="round" stroke-linejoin="round" d="M 30.38 42.81 L 21.34 33.57 L 21.34 31.94 L 22.45 30.84 L 24.27 30.51"/><path fill="none" stroke="#1e436d" stroke-width="1.565" stroke-linecap="round" stroke-linejoin="round" d="M 33.7 39.56 L 23.29 29.08 L 23.29 27.39 L 24.85 25.89 L 27.39 26.09 L 36.82 35.85"/><path fill="none" stroke="#1e436d" stroke-width="1.565" stroke-linecap="round" stroke-linejoin="round" d="M 28.43 27.32 L 28.43 25.05 L 29.54 23.94 L 31.55 23.94 L 43.26 35.33"/><path fill="none" stroke="#1e436d" stroke-width="1.565" stroke-linecap="round" stroke-linejoin="round" d="M 40.34 44.18 L 40.47 40.67 L 43.46 36.5 L 43.46 32.72 L 42.35 31.68 L 42.35 26.87 L 43.52 25.63 L 45.47 25.7 L 48.27 31.88 L 50.48 37.86 L 51.26 40.07 L 51.39 43.78 L 54.45 46.84"/></svg>`;

        // Состояние устройства
        let deviceState = {
            power: false,
            brightness: 100
        };

        // DOM элементы
        const deviceIconSmall = document.getElementById('deviceIconSmall');
        const deviceName = document.getElementById('deviceName');
        const deviceDescription = document.getElementById('deviceDescription');
        const settingsBtn = document.getElementById('settingsBtn');
        const powerBtn = document.getElementById('powerBtn');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessValue = document.getElementById('brightnessValue');
        const brightnessUp = document.getElementById('brightnessUp');
        const brightnessDown = document.getElementById('brightnessDown');
        const brightnessFill = document.getElementById('brightnessFill');

        // Инициализация
        function init() {
            // Установка иконки
            deviceIconSmall.innerHTML = DEVICE_ICON;

            // Включение питания для демонстрации
            deviceState.power = true;

            // Обновление UI
            updateUI();

            // Обработчики событий
            setupEventListeners();

            // Запуск симуляции движения ползунка
            startBrightnessSimulation();
        }

        // Симуляция движения ползунка яркости
        let simulationDirection = 1;
        let simulationInterval = null;

        function startBrightnessSimulation() {
            // Симуляция плавного движения ползунка вверх и вниз
            simulationInterval = setInterval(() => {
                if (!deviceState.power) return;

                // Изменяем яркость на 1% каждый шаг
                deviceState.brightness += simulationDirection;

                // Меняем направление при достижении пределов
                if (deviceState.brightness >= 100) {
                    simulationDirection = -1;
                    deviceState.brightness = 100;
                } else if (deviceState.brightness <= 10) {
                    simulationDirection = 1;
                    deviceState.brightness = 10;
                }

                // Обновляем UI
                brightnessSlider.value = deviceState.brightness;
                brightnessValue.textContent = deviceState.brightness + '%';
                updateBrightnessFill();
            }, 50); // 50мс = плавное движение (20 шагов в секунду)
        }

        // Обновление полосы яркости
        function updateBrightnessFill() {
            brightnessFill.style.width = deviceState.brightness + '%';
        }

        // Обновление UI
        function updateUI() {
            // Обновление кнопки питания
            if (deviceState.power) {
                powerBtn.classList.add('on');
            } else {
                powerBtn.classList.remove('on');
            }

            // Обновление слайдера
            brightnessSlider.value = deviceState.brightness;
            brightnessValue.textContent = deviceState.brightness + '%';

            // Обновление полосы яркости
            updateBrightnessFill();

            // Отключение слайдера если питание выключено
            brightnessSlider.disabled = !deviceState.power;
            brightnessUp.disabled = !deviceState.power;
            brightnessDown.disabled = !deviceState.power;
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Кнопка питания
            powerBtn.addEventListener('click', togglePower);

            // Слайдер яркости
            brightnessSlider.addEventListener('input', handleBrightnessChange);

            // Кнопки +/-
            brightnessUp.addEventListener('click', () => adjustBrightness(5));
            brightnessDown.addEventListener('click', () => adjustBrightness(-5));

            // Кнопка настроек - переключение темной темы
            settingsBtn.addEventListener('click', toggleDarkTheme);
        }

        // Переключение темной темы
        function toggleDarkTheme() {
            document.body.classList.toggle('dark-theme');
            // Сохранение состояния темы (для будущей реализации)
            // localStorage.setItem('darkTheme', document.body.classList.contains('dark-theme'));
        }

        // Переключение питания
        function togglePower() {
            deviceState.power = !deviceState.power;

            // Если включаем, устанавливаем последнюю яркость
            if (deviceState.power && deviceState.brightness === 0) {
                deviceState.brightness = 50;
            }

            updateUI();
            sendState();
        }

        // Изменение яркости
        function handleBrightnessChange() {
            // Останавливаем симуляцию при ручном управлении
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
            }

            deviceState.brightness = parseInt(brightnessSlider.value);
            brightnessValue.textContent = deviceState.brightness + '%';
            updateBrightnessFill();
        }

        // Регулировка яркости кнопками
        function adjustBrightness(delta) {
            // Останавливаем симуляцию при ручном управлении
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
            }

            if (!deviceState.power) {
                // Если выключено, включаем и устанавливаем яркость
                deviceState.power = true;
                powerBtn.classList.add('on');
            }

            deviceState.brightness = Math.max(0, Math.min(100, deviceState.brightness + delta));
            brightnessSlider.value = deviceState.brightness;
            brightnessValue.textContent = deviceState.brightness + '%';
            updateBrightnessFill();
            sendState();
        }

        // Отправка состояния на сервер (заглушка)
        function sendState() {
            console.log('Sending state:', deviceState);
            // TODO: Отправить POST запрос на /api/lamp/control
            // fetch('/api/lamp/control', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(deviceState)
            // });
        }

        // Запуск
        init();
    </script>
</body>
